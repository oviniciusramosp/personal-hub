<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><meta name="color-scheme" content="dark"><title>Meu espaço · Acesso privado</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#10120f;color:#e9ece6;font:15px system-ui,sans-serif;display:grid;place-items:center;padding:24px}main{width:100%;max-width:410px}.mark{background:#c5ed8b;color:#18210e;display:inline-block;padding:14px;border-radius:16px;font-size:20px;font-weight:700;margin-bottom:28px}small{display:block;color:#a7c68a;letter-spacing:2px;font-size:10px}h1{font-size:38px;letter-spacing:-1.5px;font-weight:550;margin:14px 0}p{color:#a5ad9d;line-height:1.6;margin-bottom:32px}label{display:block;color:#b8c0ae;font-size:13px;margin-bottom:10px}input,button{font:inherit;border-radius:10px;padding:15px;width:100%}input{border:1px solid #3f4c32;background:#1b2215;color:#ecf3e4;outline-offset:5px}button{margin-top:14px;background:#c5ed8b;color:#17220d;border:0;font-weight:600;cursor:pointer}button:disabled{opacity:.6;cursor:wait}#error{color:#eab4a6;min-height:24px;font-size:13px;margin:12px 0}footer{color:#727e67;font-size:11px;margin-top:35px;border-top:1px solid #30382a;padding-top:22px}
</style></head><body><main><span class="mark">vr.</span><small>ACESSO PRIVADO</small><h1>Seu espaço de criação.</h1><p>Desbloqueie seu catálogo de ferramentas e projetos para continuar de onde parou.</p><form id="unlock"><label for="password">Senha de acesso</label><input id="password" type="password" autocomplete="current-password" required autofocus><button id="submit" type="submit">Entrar no meu espaço ↗</button><p id="error" role="alert" aria-live="polite"></p></form><footer>Catálogo criptografado · Sua senha fica neste navegador apenas durante o desbloqueio.</footer><noscript>Ative o JavaScript para desbloquear o catálogo.</noscript></main><script>
const payload=/*ENCRYPTED_PAYLOAD*/;
function bytes(b64){return Uint8Array.from(atob(b64),c=>c.charCodeAt(0))}
document.querySelector('#unlock').addEventListener('submit',async event=>{event.preventDefault();const button=document.querySelector('#submit');const input=document.querySelector('#password');const error=document.querySelector('#error');error.textContent='';button.disabled=true;button.textContent='Desbloqueando…';try{if(!globalThis.crypto?.subtle)throw new Error('unsupported');const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(input.value),'PBKDF2',false,['deriveKey']);input.value='';const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(payload.salt),iterations:payload.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);const clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(payload.iv)},key,bytes(payload.data));document.open();document.write(new TextDecoder().decode(clear));document.close()}catch(e){error.textContent=e.message==='unsupported'?'Use um navegador atualizado em uma conexão HTTPS.':'Senha incorreta. Tente novamente.';button.disabled=false;button.textContent='Entrar no meu espaço ↗';input.focus()}});
</script></body></html>
