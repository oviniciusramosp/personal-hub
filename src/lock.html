<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><meta name="color-scheme" content="dark"><title>Meu espaço · Acesso privado</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#10120f;color:#e9ece6;font:15px system-ui,sans-serif;display:grid;place-items:center;padding:24px}main{width:100%;max-width:410px}.mark{background:#c5ed8b;color:#18210e;display:inline-block;padding:14px;border-radius:16px;font-size:20px;font-weight:700;margin-bottom:28px}small{display:block;color:#a7c68a;letter-spacing:2px;font-size:10px}h1{font-size:38px;letter-spacing:-1.5px;font-weight:550;margin:14px 0}p{color:#a5ad9d;line-height:1.6;margin-bottom:32px}label{display:block;color:#b8c0ae;font-size:13px;margin-bottom:10px}input,button{font:inherit;border-radius:10px;padding:15px;width:100%}input{border:1px solid #3f4c32;background:#1b2215;color:#ecf3e4;outline-offset:5px}button{margin-top:14px;background:#c5ed8b;color:#17220d;border:0;font-weight:600;cursor:pointer}button:disabled{opacity:.6;cursor:wait}#error{color:#eab4a6;min-height:24px;font-size:13px;margin:12px 0}footer{color:#727e67;font-size:11px;margin-top:35px;border-top:1px solid #30382a;padding-top:22px}
.remember{display:flex;align-items:center;gap:10px;margin:18px 0 6px;font-size:13px;cursor:pointer}.remember input{width:18px;height:18px;padding:0;accent-color:#c5ed8b}.hint{font-size:11px;color:#8f9b83;margin:8px 0 0}</style></head><body><main><span class="mark">vr.</span><small>ACESSO PRIVADO</small><h1>Seu espaço de criação.</h1><p>Desbloqueie seu catálogo de ferramentas e projetos para continuar de onde parou.</p><form id="unlock" autocomplete="on"><input type="hidden" name="username" autocomplete="username" value="vinicius"><label for="password">Senha de acesso</label><input id="password" name="password" type="password" autocomplete="current-password" required autofocus><label class="remember"><input id="remember" type="checkbox">Lembrar acesso neste navegador</label><p class="hint">Use em um dispositivo pessoal. “Sair” remove o acesso salvo.</p><button id="submit" type="submit">Entrar no meu espaço ↗</button><p id="error" role="alert" aria-live="polite"></p></form><footer>Catálogo criptografado · Você escolhe se deseja lembrar o acesso.</footer><noscript>Ative o JavaScript para desbloquear o catálogo.</noscript></main><script>
const payload=/*ENCRYPTED_PAYLOAD*/;
function bytes(b64){return Uint8Array.from(atob(b64),c=>c.charCodeAt(0))}
function savedAccess(action,value){return new Promise((resolve,reject)=>{const request=indexedDB.open('personal-hub-access',1);request.onupgradeneeded=()=>request.result.createObjectStore('keys');request.onerror=()=>reject(request.error);request.onsuccess=()=>{const db=request.result;const tx=db.transaction('keys',action==='get'?'readonly':'readwrite');const store=tx.objectStore('keys');const op=action==='get'?store.get('material'):action==='put'?store.put(value,'material'):store.delete('material');tx.oncomplete=()=>{db.close();resolve(op.result)};tx.onerror=()=>{db.close();reject(tx.error)};tx.onabort=()=>{db.close();reject(tx.error)}}})}
async function openCatalog(material){const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(payload.salt),iterations:payload.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(payload.iv)},key,bytes(payload.data)))}
function showCatalog(html){document.open();document.write(html);document.close()}
const button=document.querySelector('#submit'),input=document.querySelector('#password'),error=document.querySelector('#error');
function busy(value){button.disabled=value;button.textContent=value?'Desbloqueando…':'Entrar no meu espaço ↗'}
document.querySelector('#unlock').addEventListener('submit',async event=>{event.preventDefault();error.textContent='';busy(true);let html,material;try{if(!globalThis.crypto?.subtle)throw new Error('unsupported');material=await crypto.subtle.importKey('raw',new TextEncoder().encode(input.value),'PBKDF2',false,['deriveKey']);html=await openCatalog(material)}catch(e){error.textContent=e.message==='unsupported'?'Use um navegador atualizado em uma conexão HTTPS.':'Senha incorreta. Tente novamente.';busy(false);input.focus();return}try{if(document.querySelector('#remember').checked)await savedAccess('put',material);else await savedAccess('delete')}catch(e){if(document.querySelector('#remember').checked){error.textContent='Não foi possível salvar o acesso. Desmarque a opção para entrar sem lembrar.';busy(false);return}}showCatalog(html)});
(async()=>{busy(true);try{const material=await savedAccess('get');if(material){let html;try{html=await openCatalog(material)}catch{await savedAccess('delete');error.textContent='O acesso salvo expirou. Digite sua senha novamente.'}if(html){showCatalog(html);return}}}catch{}busy(false)})();
</script></body></html>
