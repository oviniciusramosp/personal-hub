:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:#f1f2f5;background:#101114;font-synthesis:none;color-scheme:dark}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}a{color:inherit;text-decoration:none}button,a,input,select,[tabindex]{outline-offset:5px}button{cursor:pointer}button:disabled{cursor:default;opacity:.3}.shell{max-width:1320px;margin:auto;padding:32px 36px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #2b2d34;padding-bottom:24px}.brand{display:flex;gap:12px;align-items:center;font-weight:650}.mark{background:#eeeef2;color:#14151a;padding:10px;border-radius:12px}.muted{color:#989da9;font-size:13px}.logout{border:1px solid #393d47;background:transparent;color:#c9cbd3;padding:9px 15px;border-radius:8px}.intro{padding:48px 0 24px}.eyebrow{font-size:10px;letter-spacing:2px;color:#a9aebd}h1{font-size:clamp(32px,5vw,52px);letter-spacing:-2px;margin:14px 0}p{line-height:1.6}.intro p{color:#a2a7b3;margin:0}.stats{display:flex;gap:32px;margin-top:24px}.stats strong{font-size:23px;margin-right:7px;color:#eeeef5}.toolbar{display:flex;gap:12px;flex-wrap:wrap;padding:24px 0}.search{flex:1;min-width:220px}input,select{border:1px solid #333640;background:#191b21;color:#e9eaf0;border-radius:10px;padding:14px 16px}input::placeholder{color:#858a98}.tabs{display:flex;gap:8px;margin:4px 0 20px;flex-wrap:wrap}.tabs button{border:1px solid #313540;border-radius:30px;padding:9px 16px;background:transparent;color:#a6abb8}.tabs button[aria-pressed=true]{background:#e3e5eb;color:#17191f;border-color:#e3e5eb}.tabs.categories button{color:var(--accent,#cbd0db)}.tabs.categories button[aria-pressed=true]{background:var(--tint,#2c3039);border-color:var(--accent,#cbd0db);color:var(--accent,#cbd0db)}.tabs.categories{flex-wrap:nowrap;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:thin;scrollbar-color:#454b58 transparent;padding-bottom:20px;border-bottom:1px solid #2b2d34}.categ ne-height:1.25;margin:20px 0 9px;overflow-wrap:anywhere}.description{font-size:13px;color:#afb4c1;margin:0 0 20px;line-height:1.65}.bottom{margin-top:auto}.date{font-size:10px;color:#9299a9;border-bottom:1px solid #303540;padding-bottom:15px;margin-bottom:15px}.links{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:38px}.primary{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:0 20px;border-radius:10px;font-size:13px;font-weight:650;background:var(--accent);color:#10151b;transition:filter .15s}.primary:hover{filter:brightness(1.15)}.repo-actions{display:flex;align-items:center;gap:8px;margin-left:auto}.icon-action{width:38px;height:38px;display:grid;place-items:center;position:relative;border:1px solid #3a404d;background:#22262f;color:#bec5d2;border-radius:10px;padding:9px;transition:color .15s,border-color .15s}.icon-action svg,.carousel-controls svg{width:18px;height:18px;display:block}.icon-action:hover{color:#fff;border-color:var(--accent)}.icon-action[data-state=copied]{color:#a7f3bd;border-color:#2b8a4a}.empty{padding:56px;text-align:center;color:#a6adbd}footer{padding:24px 0;font-size:11px;color:#858d9d;display:flex;justify-content:space-between;gap:20px}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:5;background:#eef1f6;color:#151922;padding:12px 20px;border-radius:12px;font-size:13px;box-shadow:0 8px 30px #0006;pointer-events:none;opacity:0;transition:opacity .15s}#toast.show{opacity:1}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}@media(max-width:600px){.shell{padding:20px}.intro{padding-top:32px}.card{flex-basis: min(304px,84vw);padding:20px}.stats{gap:18px;flex-wrap:wrap}.stats strong{font-size:20px}header .muted{display:none}footer{flex-direction:column}.toolbar>*{width:100%}h1{letter-spacing:-1px}.category-title{font-size:21px}.categories{flex-wrap:nowrap;overflow-x:auto;padding-bottom:16px}.categories </style></head><body><div class="shell"><header><div class="brand"><span class="mark">vr.</span><span>Meu espaço<br><span class="muted">Vinicius Ramos</span></span></div><button class="logout" id="lock">Sair</button></header><main><section class="intro"><span class="eyebrow">SEU PONTO DE PARTIDA</span><h1>Tudo o que você constrói.</h1><p>Suas ferramentas, projetos e repositórios. Um lugar para encontrar e continuar.</p><div class="stats" id="stats"></div></section><div class="toolbar"><input class="search" id="search" type="search" placeholder="Buscar ferramenta, projeto ou linguagem…" aria-label="Buscar projetos"><select id="sort" aria-label="Ordenar"><option value="recent">Mais Recente</option><option value="name">Nome: A → Z</option></select><details class="filter-menu" id="filters"><summary id="filter-trigger">Filtros<span id="filter-status"></span></summary><div class="filter-panel"><nav class="tabs" aria-label="Filtrar projetos"><button data-filter="all" aria-pressed="true">Todos</button><button data-filter="tools" aria-pressed="false">Ferramentas publicadas</button><button data-filter="repos" aria-pressed="false">Repositórios</button><button data-filter="private" aria-pressed="false">Privados</button></nav></div></details></div><nav class="tabs categories" id="categories" aria-label="Categorias"></nav><div class="heading"><h2 id="section-title">Todos os projetos</h2><span class="muted" id="count" aria-live="polite"></span></div><div id="grid"></div><div id="toast" role="status" aria-live="polite"></div></main><footer><span id="sync"></span><span>As ferramentas mantêm suas próprias permissões de acesso.</span></footer></div><dialog id="preview-dialog" aria-labelledby="preview-title"><div class="preview-dialog-header"><h2 id="preview-title"></h2><button id="close-preview" type="button" aria-label="Fechar prévia">×</button></div><img id="preview-image" alt=""><p id="preview-note"></p></dialog><script>
const catalog=/*CATALOG_DATA*/;
let filter='all',category='Todas',toastTimer;
const categories=['Crypto Bros','Paradigma','Carol Nutri','Levain App','Trading','Apps Web','Apps Mobile','Vision OS','Outros'];
const themes={
 'Carol Nutri':{accent:'#89d5a6',tint:'#20382b',hue:144},
 'Levain App':{accent:'#e8bf89',tint:'#382d22',hue:34},
 'Trading':{accent:'#66d3b3',tint:'#1c3531',hue:164},
 'Crypto Bros':{accent:'#ff9a42',tint:'#35251c',hue:27},
 'Paradigma':{accent:'#bb92ff',tint:'#2c233d',hue:268},
 'Apps Web':{accent:'#bfc5d0',tint:'#2b2e35',hue:216},
 'Apps Mobile':{accent:'#6aaaff',tint:'#1e2b42',hue:215},
 'Vision OS':{accent:'#54d9eb',tint:'#19333c',hue:188},
 'Outros':{accent:'#cabca6',tint:'#302b25',hue:35}
};
function categoryOf(e){if(categories.includes(e.category))return e.category;const n=e.name.toLowerCase();if(/^(carol-nutri|carolnutri)$/.test(n))return 'Carol Nutri';if(/^(bread-|levain-)/.test(n))return 'Levain App';if(/^(mexcbot|autotrader|crypto-pattern-lab|tradingview-mcp|walletradar|bitget-bot|entrylab|bitcoin-daily-data)$/.test(n))return 'Trading';if(/^(crypto-bros|cryptobro)/.test(n))return 'Crypto Bros';if(/paradigma|gerador-relatorios|invite-ticket/.test(n))return 'Paradigma';if(/vision|spatial|hexbeat|aquarium|bubblehabits/.test(n))return 'Vision OS';if(/biblia-duo|bread-|macros-calculator|parmeirense|vitalis-|expo-splash|ios-claude/.test(n))return 'Apps Mobile';if(/gridfinity|matriz-de-relevo|carol|casadadoula|ticker-website|travel-boss|portfolio|personal-hub|mdf studio|saylor studio|consultórios|invoices|levain-app/.test(n))return 'Apps Web';return 'Outros'}
const $=s=>document.querySelector(s);
const date=v=>v?new Intl.DateTimeFormat('pt-BR',{dateStyle:'medium',timeStyle:'short',timeZone:'America/Sao_Paulo'}).format(new Date(v)):'Não disponível';
function element(tag,text,cls){const e=document.createElement(tag);if(text)e.textContent=text;if(cls)e.className=cls;return e}
function applyTheme(node,group){const theme=themes[group];node.style.setProperty('--accent',theme.accent);node.style.setProperty('--tint',theme.tint)}
function link(text,url,cls){const a=element('a',text,cls);a.href=url;a.target='_blank';a.rel='noopener noreferrer';return a}
const uiIcons={copy:'<rect x="8" y="8" width="12" height="13" rx="2"/><path d="M15 8V3H4v13h4"/>',check:'<path d="m5 12 4 4L19 6"/>',error:'<path d="m6 6 12 12M18 6 6 18"/>',left:'<path d="m14 5-7 7 7 7"/>',right:'<path d="m10 5 7 7-7 7"/>',github:'<path fill="currentColor" stroke="none" d="M12 .7a11.3 11.3 0 0 0-3.57 22.02c.56.1.77-.24.77-.54v-2.11c-3.14.68-3.8-1.33-3.8-1.33-.51-1.3-1.26-1.65-1.26-1.65-1.02-.7.08-.69.08-.69 1.13.08 1.73 1.16 1.73 1.16 1 1.72 2.64 1.22 3.28.93.1-.73.4-1.22.71-1.5-2.5-.29-5.14-1.26-5.14-5.59 0-1.23.44-2.24 1.16-3.03-.12-.29-.5-1.43.11-2.99 0 0 .95-.3 3.11 1.16A10.8 10.8 0 0 1 12 6.16c.96 0 1.92.13 2.82.38 2.16-1.46 3.11-1.16 3.11-1.16.61 1.56.23 2.7.11 2.99.72.79 1.16 1.8 1.16 3.03 0 4.34-2.64 5.3-5.16 5.58.41.35.77 1.04.77 2.1v3.1c0 .3.2.65.78.54A11.3 11.3 0 0 0 12 .7z"/>'};
function svgIcon(mark){const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 24 24');svg.setAttribute('fill','none');svg.setAttribute('stroke','currentColor');svg.setAttribute('stroke-width','1.7');svg.setAttribute('stroke-linecap','round');svg.setAttribute('stroke-linejoin','round');svg.setAttribute('aria-hidden','true');svg.innerHTML=uiIcons[mark];return svg}
/*MOCK_PREVIEW_RENDERER*/
function announce(message){clearTimeout(toastTimer);$('#toast').textContent=message;$('#toast').classList.add('show');toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),2200)}
function cardFor(e,group){const card=element('article',null,'card'),name=e.displayName||e.name;const top=element('div',null,'card-top');top.append(mockPreview(e,group),element('span',e.private?'PRIVADO':e.site?'PUBLICADO':'REPOSITÓRIO',e.site&&!e.private?'badge published':'badge'));card.append(top,element('h3',name),element('p',e.description,'description'));const bottom=element('div',null,'bottom');bottom.append(element('div',e.repo?'Último push · '+date(e.pushedAt):'Atualização no Sites · '+date(e.publishedAt),'date'));const links=element('div',null,'links');if(e.site){const access=link('Acessar',e.site,'primary');access.setAttribute('aria-label','Acessar '+name);links.append(access)}if(e.repo){const actions=element('div',null,'repo-actions');const github=link(null,e.repo,'icon-action');github.title='GitHub · '+name;github.setAttribute('aria-label','GitHub · '+name);github.append(svgIcon('github'));const copy=element('button',null,'icon-action copy-repo');copy.type='button';copy.setAttribute('aria-label','Copiar URL do repositório '+name);copy.title='Copiar URL do repositório';copy.append(svgIcon('copy'));copy.addEventListener('click',async()=>{copy.disabled=true;try{await navigator.clipboard.writeText(e.repo);copy.dataset.state='copied';copy.replaceChildren(svgIcon('check'));announce('URL do repositório copiada')}catch{copy.replaceChildren(svgIcon('error'));announce('Não foi possível copiar a URL')}finally{copy.disabled=false;setTimeout(()=>{copy.replaceChildren(svgIcon('copy'));delete copy.dataset.state},2200)}});actions.append(github,copy);links.append(actions)}bottom.append(links);card.append(bottom);return card}
function render(){const q=$('#search').value.trim().toLocaleLowerCase('pt-BR');let entries=catalog.entries.filter(e=>(category==='Todas'||categoryOf(e)===category)&&(!q||[e.name,e.displayName,e.description,e.language,categoryOf(e)].join(' ').toLocaleLowerCase('pt-BR').includes(q))&&(filter==='all'||filter==='tools'&&e.site||filter==='repos'&&e.repo||filter==='private'&&e.private));entries.sort((a,b)=>$('#sort').value==='name'?(a.displayName||a.name).localeCompare(b.displayName||b.name):new Date(b.pushedAt||b.publishedAt||0)-new Date(a.pushedAt||a.publishedAt||0));document.querySelectorAll('.carousel').forEach(c=>c._observer?.disconnect());$('#grid').replaceChildren();$('#count').textContent=entries.length+(entries.length===1?' resultado':' resultados');const labels={all:'Todos os projetos',tools:'Ferramentas publicadas',repos:'Repositórios',private:'Privados'};$('#section-title').textContent=category==='Todas'?labels[filter]:category+(filter==='all'?'':' · '+labels[filter]);for(const group of categories){const grouped=entries.filter(e=>categoryOf(e)===group);if(!grouped.length)continue;const section=element('section',null,'category-section');applyTheme(section,group);const heading=element('div',null,'category-heading');const title=element('h2',null,'category-title');title.id='group-'+categories.indexOf(group);title.append(element('span',null,'category-dot'),document.createTextNode(group),element('span',String(grouped.length),'category-count'));const carousel=element('div',null,'carousel');carousel.tabIndex=0;carousel.setAttribute('role','region');carousel.setAttribute('aria-labelledby',title.id);const controls=element('div',null,'carousel-controls');const previous=element('button'),next=element('button');previous.type=next.type='button';previous.setAttribute('aria-label','Projetos anteriores de '+group);next.setAttribute('aria-label','Próximos projetos de '+group);previous.append(svgIcon('left'));next.append(svgIcon('right'));const move=direction=>carousel.scrollBy({left:direction*(carousel.querySelector('.card').getBoundingClientRect().width+16),behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});previous.addEventListener('click',()=>move(-1));next.addEventListener('click',()=>move(1));carousel.addEventListener('keydown',event=>{if(event.target!==carousel)return;if(event.key==='ArrowRight'||event.key==='ArrowLeft'){event.preventDefault();move(event.key==='ArrowRight'?1:-1)}});function updateControls(){previous.disabled=carousel.scrollLeft<=2;next.disabled=carousel.scrollLeft+carousel.clientWidth>=carousel.scrollWidth-2}carousel.addEventListener('scroll',updateControls,{passive:true});const observer=new ResizeObserver(updateControls);observer.observe(carousel);carousel._observer=observer;controls.append(previous,next);heading.append(title,controls);for(const e of grouped)carousel.append(cardFor(e,group));section.append(heading,carousel);$('#grid').append(section);updateControls()}if(!entries.length)$('#grid').append(element('div','Nenhum projeto encontrado. Tente outro termo ou filtro.','empty'))}
$('#stats').append(...[[catalog.entries.filter(e=>e.site).length,'publicados'],[catalog.entries.filter(e=>e.repo).length,'repositórios']].map(([n,t])=>{const e=element('span',null,'muted');e.append(element('strong',String(n)),document.createTextNode(t));return e}));$('#sync').textContent='Catálogo sincronizado em '+date(catalog.syncedAt)+' · horário de Brasília';$('#search').addEventListener('input',render);$('#sort').addEventListener('change',render);document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;$('#filter-status').textContent=filter==='all'?'':b.textContent;$('#filters').open=false;document.querySelectorAll('[data-filter]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render()}));for(const name of ['Todas',...categories]){const b=element('button',name);b.type='button';if(themes[name])applyTheme(b,name);b.setAttribute('aria-pressed',String(name===category));b.addEventListener('click',()=>{category=name;document.querySelectorAll('#categories button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render()});$('#categories').append(b)}
$('#close-preview').addEventListener('click',()=>$('#preview-dialog').close());$('#preview-dialog').addEventListener('click',event=>{if(event.target===$('#preview-dialog')){const r=event.target.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)event.target.close()}});
document.addEventListener('click',event=>{if(!$('#filters').contains(event.target))$('#filters').open=false});document.addEventListener('keydown',event=>{if(event.key==='Escape'&&$('#filters').open){$('#filters').open=false;$('#filter-trigger').focus()}});
$('#lock').addEventListener('click',async()=>{const button=$('#lock');button.disabled=true;try{await new Promise((resolve,reject)=>{const request=indexedDB.open('personal-hub-access',1);request.onupgradeneeded=()=>request.result.createObjectStore('keys');request.onerror=()=>reject(request.error);request.onsuccess=()=>{const db=request.result;const tx=db.transaction('keys','readwrite');tx.objectStore('keys').delete('material');tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)}}});location.reload()}catch{button.disabled=false;button.textContent='Não foi possível sair. Tente novamente.'}});render();
</script></body></html>
