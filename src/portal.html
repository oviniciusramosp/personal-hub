function appIcon(e,group){const name=e.name;let hash=0;for(const char of name)hash=(Math.imul(hash,31)+char.codePointAt(0))>>>0;const theme=themes[group],hue=theme.hue+(hash%13)-6,saturation=group==='Apps Web'?14:75;const id='app-'+hash;const wrap=element('div',null,'app-icon');wrap.setAttribute('aria-hidden','true');const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 96 96');const initials=name.split(/[- ·]+/).filter(Boolean).map(w=>w[0]).join('').slice(0,2).toUpperCase();svg.innerHTML=`<defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop stop-color="hsl(${hue} ${saturation}% 66%)"/><stop offset="1" stop-color="hsl(${hue+(group==='Crypto Bros'?-8:8)} ${saturation}% 27%)"/></linearGradient><radialGradient id="${id}-light" cx=".1" cy="0" r="1"><stop stop-color="white" stop-opacity=".32"/><stop offset="1" stop-color="white" stop-opacity="0"/></radialGradient></defs><rect width="96" height="96" rx="24" fill="url(#${id})"/><rect x=".5" y=".5" width="95" height="95" rx="23.5" fill="url(#${id}-light)" stroke="white" stroke-opacity=".2"/><circle cx="84" cy="88" r="40" fill="white" fill-opacity=".06"/><g transform="translate(21 17) scale(1.12)" fill="none" stroke="white" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">${glyphs[e.icon]||glyphs.code}</g><text x="79" y="83" text-anchor="end" fill="white" fill-opacity=".65" font-family="system-ui,sans-serif" font-size="9" font-weight="700"></text>`;svg.querySelector('text').textContent=initials;wrap.append(svg);return wrap}
function announce(message){clearTimeout(toastTimer);$('#toast').textContent=message;$('#toast').classList.add('show');toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),2200)}
function cardFor(e,group){const card=element('article',null,'card'),name=e.displayName||e.name;const top=element('div',null,'card-top');top.append(appIcon(e,group),element('span',e.private?'PRIVADO':e.site?'PUBLICADO':'REPOSITÓRIO',e.site&&!e.private?'badge published':'badge'));card.append(top,element('h3',name),element('p',e.description,'description'));const bottom=element('div',null,'bottom');bottom.append(element('div',e.repo?'Último push · '+date(e.pushedAt):'Atualização no Sites · '+date(e.publishedAt),'date'));const links=element('div',null,'links');if(e.site){const access=link('Acessar',e.site,'primary');access.setAttribute('aria-label','Acessar '+name);links.append(access)}if(e.repo){const actions=element('div',null,'repo-actions');const github=link(null,e.repo,'icon-action');github.title='GitHub · '+name;github.setAttribute('aria-label','GitHub · '+name);github.append(svgIcon('github'));const copy=element('button',null,'icon-action copy-repo');copy.type='button';copy.setAttribute('aria-label','Copiar URL do repositório '+name);copy.title='Copiar URL do repositório';copy.append(svgIcon('copy'));copy.addEventListener('click',async()=>{copy.disabled=true;try{await navigator.clipboard.writeText(e.repo);copy.dataset.state='copied';copy.replaceChildren(svgIcon('check'));announce('URL do repositório copiada')}catch{copy.replaceChildren(svgIcon('error'));announce('Não foi possível copiar a URL')}finally{copy.disabled=false;setTimeout(()=>{copy.replaceChildren(svgIcon('copy'));delete copy.dataset.state},2200)}});actions.append(github,copy);links.append(actions)}bottom.append(links);card.append(bottom);return card}
function render(){const q=$('#search').value.trim().toLocaleLowerCase('pt-BR');let entries=catalog.entries.filter(e=>(category==='Todas'||categoryOf(e)===category)&&(!q||[e.name,e.displayName,e.description,e.language,categoryOf(e)].join(' ').toLocaleLowerCase('pt-BR').includes(q))&&(filter==='all'||filter==='tools'&&e.site||filter==='repos'&&e.repo||filter==='private'&&e.private));entries.sort((a,b)=>$('#sort').value==='name'?(a.displayName||a.name).localeCompare(b.displayName||b.name):new Date(b.pushedAt||b.publishedAt||0)-new Date(a.pushedAt||a.publishedAt||0));document.querySelectorAll('.carousel').forEach(c=>c._observer?.disconnect());$('#grid').replaceChildren();$('#count').textContent=entries.length+(entries.length===1?' resultado':' resultados');const labels={all:'Todos os projetos',tools:'Ferramentas publicadas',repos:'Repositórios',private:'Privados'};$('#section-title').textContent=category==='Todas'?labels[filter]:category+(filter==='all'?'':' · '+labels[filter]);for(const group of categories){const grouped=entries.filter(e=>categoryOf(e)===group);if(!grouped.length)continue;const section=element('section',null,'category-section');applyTheme(section,group);const heading=element('div',null,'category-heading');const title=element('h2',null,'category-title');title.id='group-'+categories.indexOf(group);title.append(element('span',null,'category-dot'),document.createTextNode(group),element('span',String(grouped.length),'category-count'));const carousel=element('div',null,'carousel');carousel.tabIndex=0;carousel.setAttribute('role','region');carousel.setAttribute('aria-labelledby',title.id);const controls=element('div',null,'carousel-controls');const previous=element('button'),next=element('button');previous.type=next.type='button';previous.setAttribute('aria-label','Projetos anteriores de '+group);next.setAttribute('aria-label','Próximos projetos de '+group);previous.append(svgIcon('left'));next.append(svgIcon('right'));const move=direction=>carousel.scrollBy({left:direction*(carousel.querySelector('.card').getBoundingClientRect().width+16),behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});previous.addEventListener('click',()=>move(-1));next.addEventListener('click',()=>move(1));carousel.addEventListener('keydown',event=>{if(event.target!==carousel)return;if(event.key==='ArrowRight'||event.key==='ArrowLeft'){event.preventDefault();move(event.key==='ArrowRight'?1:-1)}});function updateControls(){previous.disabled=carousel.scrollLeft<=2;next.disabled=carousel.scrollLeft+carousel.clientWidth>=carousel.scrollWidth-2}carousel.addEventListener('scroll',updateControls,{passive:true});const observer=new ResizeObserver(updateControls);observer.observe(carousel);carousel._observer=observer;controls.append(previous,next);heading.append(title,controls);for(const e of grouped)carousel.append(cardFor(e,group));section.append(heading,carousel);$('#grid').append(section);updateControls()}if(!entries.length)$('#grid').append(element('div','Nenhum projeto encontrado. Tente outro termo ou filtro.','empty'))}
$('#stats').append(...[[catalog.entries.filter(e=>e.site).length,'publicados'],[catalog.entries.filter(e=>e.repo).length,'repositórios']].map(([n,t])=>{const e=element('span',null,'muted');e.append(element('strong',String(n)),document.createTextNode(t));return e}));$('#sync').textContent='Catálogo sincronizado em '+date(catalog.syncedAt)+' · horário de Brasília';$('#search').addEventListener('input',render);$('#sort').addEventListener('change',render);document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;$('#filter-status').textContent=filter==='all'?'':b.textContent;$('#filters').open=false;document.querySelectorAll('[data-filter]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render()}));for(const name of ['Todas',...categories]){const b=element('button',name);b.type='button';if(themes[name])applyTheme(b,name);b.setAttribute('aria-pressed',String(name===category));b.addEventListener('click',()=>{category=name;document.querySelectorAll('#categories button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render()});$('#categories').append(b)}
document.addEventListener('click',event=>{if(!$('#filters').contains(event.target))$('#filters').open=false});document.addEventListener('keydown',event=>{if(event.key==='Escape'&&$('#filters').open){$('#filters').open=false;$('#filter-trigger').focus()}});
$('#lock').addEventListener('click',async()=>{const button=$('#lock');button.disabled=true;try{await new Promise((resolve,reject)=>{const request=indexedDB.open('personal-hub-access',1);request.onupgradeneeded=()=>request.result.createObjectStore('keys');request.onerror=()=>reject(request.error);request.onsuccess=()=>{const db=request.result;const tx=db.transaction('keys','readwrite');tx.objectStore('keys').delete('material');tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)}}});location.reload()}catch{button.disabled=false;button.textContent='Não foi possível sair. Tente novamente.'}});render();
</script></body></html>
