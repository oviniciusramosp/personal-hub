<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark"><title>Meu espaço · Vinicius Ramos</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#e9ece6;background:#10120f;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}a{color:inherit;text-decoration:none}button,a,input,select{outline-offset:5px}button{cursor:pointer}.shell{max-width:1280px;margin:auto;padding:32px 36px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #30352b;padding-bottom:24px}.brand{display:flex;gap:12px;align-items:center;font-weight:650}.mark{background:#c5ed8b;color:#18210e;padding:10px;border-radius:12px}.muted{color:#9ba393;font-size:13px}.logout{border:1px solid #3e4636;background:transparent;color:#d1d8c9;padding:9px 15px;border-radius:8px}.intro{padding:56px 0 32px}.eyebrow{font-size:11px;letter-spacing:2px;color:#b6d98b}h1{font-size:clamp(32px,5vw,54px);letter-spacing:-2px;margin:14px 0}p{line-height:1.6}.intro p{color:#a5ad9d;margin:0}.stats{display:flex;gap:32px;margin-top:26px}.stats strong{font-size:24px;margin-right:7px;color:#d6e7c1}.toolbar{display:flex;gap:12px;flex-wrap:wrap;padding:24px 0}.search{flex:1;min-width:220px}input,select{border:1px solid #38402f;background:#1a1f16;color:#e7eddf;border-radius:10px;padding:14px 16px}input::placeholder{color:#909984}.tabs{display:flex;gap:8px;margin:4px 0 24px;flex-wrap:wrap}.tabs button{border:1px solid #333b2b;border-radius:30px;padding:10px 17px;background:transparent;color:#a9b29e}.tabs button[aria-pressed=true]{background:#c5ed8b;color:#17220d;border-color:#c5ed8b}.category-section{margin:24px 0 40px}.category-title{font-size:21px;display:flex;align-items:center;gap:12px}.category-title span{font-size:12px;color:#9ba393;border:1px solid #38402f;border-radius:20px;padding:3px 8px}.categories{padding-bottom:16px;border-bottom:1px solid #30382a}.heading{display:flex;justify-content:space-between;align-items:center;margin:12px 0 20px}h2{font-size:18px;font-weight:550}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{border:1px solid #30382a;background:#181d14;border-radius:16px;padding:24px;display:flex;flex-direction:column;min-height:245px;transition:border-color .15s}.card:hover{border-color:#66794d}.card-top{display:flex;align-items:center;justify-content:space-between;gap:10px}.icon{font-size:22px;width:44px;height:44px;display:grid;place-items:center;border-radius:12px;background:#29351e;color:#c5ed8b}.badge.published{color:#a7f3bd;background:#123a24;border-color:#2b8a4a}.repo-actions{display:flex;align-items:center;gap:12px;margin-left:auto}.copy-repo{font-size:11px;color:#bcc8b1;background:#232c1d;border:1px solid #445337;border-radius:7px;padding:7px 9px;white-space:nowrap}.copy-repo:hover{background:#303e25;color:#e3f3d3}.copy-repo:disabled{cursor:wait}.links{flex-wrap:wrap}.badge{font-size:10px;letter-spacing:.7px;color:#aaba96;border:1px solid #3b4730;padding:5px 8px;border-radius:20px}h3{font-size:17px;margin:20px 0 6px;overflow-wrap:anywhere}.description{font-size:13px;color:#a4ae98;margin:0 0 20px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.bottom{margin-top:auto}.date{font-size:11px;color:#87947c;border-bottom:1px solid #30382a;padding-bottom:16px;margin-bottom:16px}.links{display:flex;align-items:center;justify-content:space-between;gap:10px}.primary{font-size:13px;color:#d6f5ae}.secondary{font-size:12px;color:#9aa88c}.empty{padding:64px;text-align:center;color:#a9b29e;grid-column:1/-1}footer{padding:32px 0;font-size:11px;color:#849178;display:flex;justify-content:space-between;gap:20px}#notice{color:#c5ed8b}@media(max-width:950px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.shell{padding:20px}.intro{padding-top:36px}.grid{grid-template-columns:1fr}.stats{gap:14px;flex-wrap:wrap}.stats strong{font-size:20px}header .muted{display:none}footer{flex-direction:column}.toolbar>*{width:100%}h1{letter-spacing:-1px}}
</style></head><body><div class="shell"><header><div class="brand"><span class="mark">vr.</span><span>Meu espaço<br><span class="muted">Vinicius Ramos</span></span></div><button class="logout" id="lock">Bloquear e esquecer ↗</button></header><main><section class="intro"><span class="eyebrow">SEU PONTO DE PARTIDA</span><h1>Tudo o que você constrói.</h1><p>Suas ferramentas, projetos e repositórios. Um lugar para encontrar e continuar.</p><div class="stats" id="stats"></div></section><div class="toolbar"><input class="search" id="search" type="search" placeholder="Buscar ferramenta, projeto ou linguagem…" aria-label="Buscar projetos"><select id="sort" aria-label="Ordenar"><option value="recent">Atualizados recentemente</option><option value="name">Nome: A → Z</option></select></div><nav class="tabs categories" id="categories" aria-label="Categorias"></nav><nav class="tabs" aria-label="Filtrar projetos"><button data-filter="all" aria-pressed="true">Todos</button><button data-filter="tools" aria-pressed="false">Ferramentas publicadas</button><button data-filter="repos" aria-pressed="false">Repositórios</button><button data-filter="private" aria-pressed="false">Privados</button></nav><div class="heading"><h2 id="section-title">Todos os projetos</h2><span class="muted" id="count" aria-live="polite"></span></div><div id="grid"></div></main><footer><span id="sync"></span><span>As ferramentas mantêm suas próprias permissões de acesso.</span></footer></div><script>
const catalog=/*CATALOG_DATA*/;
let filter='all',category='Todas';
const categories=['Crypto Bros','Paradigma','Apps Web','Apps Mobile','Vision OS','Outros'];
function categoryOf(e){if(categories.includes(e.category))return e.category;const n=e.name.toLowerCase();if(/^(crypto-bros|cryptobro)/.test(n))return 'Crypto Bros';if(/paradigma|gerador-relatorios|invite-ticket/.test(n))return 'Paradigma';if(/vision|spatial|hexbeat|aquarium|bubblehabits/.test(n))return 'Vision OS';if(/biblia-duo|bread-|macros-calculator|parmeirense|vitalis-|expo-splash/.test(n))return 'Apps Mobile';if(/gridfinity|matriz-de-relevo|carol|casadadoula|ticker-website|travel-boss|portfolio|personal-hub|mdf studio|saylor studio|consultórios|invoices|levain-app/.test(n))return 'Apps Web';return 'Outros'}
const $=s=>document.querySelector(s);
const date=v=>v?new Intl.DateTimeFormat('pt-BR',{dateStyle:'medium',timeStyle:'short',timeZone:'America/Sao_Paulo'}).format(new Date(v)):'Não disponível';
function element(tag,text,cls){const e=document.createElement(tag);if(text)e.textContent=text;if(cls)e.className=cls;return e}
function link(text,url,cls){const a=element('a',text,cls);a.href=url;a.target='_blank';a.rel='noopener noreferrer';return a}
function render(){let entries=catalog.entries.filter(e=>{const q=$('#search').value.trim().toLocaleLowerCase('pt-BR');return (category==='Todas'||categoryOf(e)===category)&&(!q||[e.name,e.description,e.language,categoryOf(e)].join(' ').toLocaleLowerCase('pt-BR').includes(q))&&(filter==='all'||filter==='tools'&&e.site||filter==='repos'&&e.repo||filter==='private'&&e.private)});entries.sort((a,b)=>$('#sort').value==='name'?a.name.localeCompare(b.name):new Date(b.pushedAt||b.publishedAt||0)-new Date(a.pushedAt||a.publishedAt||0));$('#grid').replaceChildren();$('#count').textContent=entries.length+(entries.length===1?' resultado':' resultados');for(const group of categories){const grouped=entries.filter(e=>categoryOf(e)===group);if(!grouped.length)continue;const section=element('section',null,'category-section');const title=element('h2',group,'category-title');title.append(element('span',String(grouped.length)));const groupGrid=element('div',null,'grid');section.append(title,groupGrid);$('#grid').append(section);for(const e of grouped){const card=element('article',null,'card');const top=element('div',null,'card-top');top.append(element('span',e.name.toLowerCase().includes('gridfinity')?'▦':e.site?'↗':'⌘','icon'),element('span',e.private?'PRIVADO':e.site?'PUBLICADO':'REPOSITÓRIO',e.site&&!e.private?'badge published':'badge'));card.append(top,element('h3',e.name),element('p',e.description||e.language||'Repositório no GitHub.','description'));const bottom=element('div',null,'bottom');bottom.append(element('div',e.repo?'Último push · '+date(e.pushedAt):'Atualização no Sites · '+date(e.publishedAt),'date'));const links=element('div',null,'links');if(e.site)links.append(link('Abrir ferramenta ↗',e.site,'primary'));if(e.repo){const actions=element('div',null,'repo-actions');actions.append(link('GitHub ↗',e.repo,'secondary'));const copy=element('button','Copiar URL','copy-repo');copy.type='button';copy.setAttribute('aria-label','Copiar URL do repositório '+e.name);copy.setAttribute('aria-live','polite');copy.title='Copiar URL do repositório';copy.addEventListener('click',async()=>{copy.disabled=true;try{await navigator.clipboard.writeText(e.repo);copy.textContent='Copiado ✓'}catch{copy.textContent='Falha ao copiar'}finally{copy.disabled=false;setTimeout(()=>{copy.textContent='Copiar URL'},2500)}});actions.append(copy);links.append(actions)}bottom.append(links);card.append(bottom);groupGrid.append(card)}}if(!entries.length)$('#grid').append(element('div','Nenhum projeto encontrado. Tente outro termo ou filtro.','empty'))}
$('#stats').append(...[[catalog.entries.filter(e=>e.site).length,'publicados'],[catalog.entries.filter(e=>e.repo).length,'repositórios']].map(([n,t])=>{const e=element('span',null,'muted');e.append(element('strong',String(n)),document.createTextNode(t));return e}));$('#sync').textContent='Catálogo sincronizado em '+date(catalog.syncedAt)+' · horário de Brasília';$('#search').addEventListener('input',render);$('#sort').addEventListener('change',render);document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));$('#section-title').textContent=b.textContent==='Todos'?'Todos os projetos':b.textContent;render()}));for(const name of ['Todas',...categories]){const b=element('button',name);b.type='button';b.setAttribute('aria-pressed',String(name===category));b.addEventListener('click',()=>{category=name;document.querySelectorAll('#categories button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render()});$('#categories').append(b)}
$('#lock').addEventListener('click',async()=>{const button=$('#lock');button.disabled=true;try{await new Promise((resolve,reject)=>{const request=indexedDB.open('personal-hub-access',1);request.onupgradeneeded=()=>request.result.createObjectStore('keys');request.onerror=()=>reject(request.error);request.onsuccess=()=>{const db=request.result;const tx=db.transaction('keys','readwrite');tx.objectStore('keys').delete('material');tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)}}});location.reload()}catch{button.disabled=false;button.textContent='Não foi possível esquecer. Tente novamente.'}});render();
</script></body></html>
