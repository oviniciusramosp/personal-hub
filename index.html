function bytes(b64){return Uint8Array.from(atob(b64),c=>c.charCodeAt(0))}
function savedAccess(action,value){return new Promise((resolve,reject)=>{const request=indexedDB.open('personal-hub-access',1);request.onupgradeneeded=()=>request.result.createObjectStore('keys');request.onerror=()=>reject(request.error);request.onsuccess=()=>{const db=request.result;const tx=db.transaction('keys',action==='get'?'readonly':'readwrite');const store=tx.objectStore('keys');const op=action==='get'?store.get('material'):action==='put'?store.put(value,'material'):store.delete('material');tx.oncomplete=()=>{db.close();resolve(op.result)};tx.onerror=()=>{db.close();reject(tx.error)};tx.onabort=()=>{db.close();reject(tx.error)}}})}
async function openCatalog(material){const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(payload.salt),iterations:payload.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(payload.iv)},key,bytes(payload.data)))}
function showCatalog(html){document.open();document.write(html);document.close()}
const button=document.querySelector('#submit'),input=document.querySelector('#password'),error=document.querySelector('#error');
function busy(value){button.disabled=value;button.textContent=value?'Desbloqueando…':'Entrar no meu espaço ↗'}
document.querySelector('#unlock').addEventListener('submit',async event=>{event.preventDefault();error.textContent='';busy(true);let html,material;try{if(!globalThis.crypto?.subtle)throw new Error('unsupported');material=await crypto.subtle.importKey('raw',new TextEncoder().encode(input.value),'PBKDF2',false,['deriveKey']);html=await openCatalog(material)}catch(e){error.textContent=e.message==='unsupported'?'Use um navegador atualizado em uma conexão HTTPS.':'Senha incorreta. Tente novamente.';busy(false);input.focus();return}try{if(document.querySelector('#remember').checked)await savedAccess('put',material);else await savedAccess('delete')}catch(e){if(document.querySelector('#remember').checked){error.textContent='Não foi possível salvar o acesso. Desmarque a opção para entrar sem lembrar.';busy(false);return}}showCatalog(html)});
(async()=>{busy(true);try{const material=await savedAccess('get');if(material){let html;try{html=await openCatalog(material)}catch{await savedAccess('delete');error.textContent='O acesso salvo expirou. Digite sua senha novamente.'}if(html){showCatalog(html);return}}}catch{}busy(false)})();
</script></body></html>
